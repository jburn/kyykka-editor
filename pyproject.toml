[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kyykka-editor"
version = "0.1.0"
description = "Desktop highlight editor for kyykka match videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.gui-scripts]
kyykka-editor = "kyykka_editor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kyykka_editor = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: exercises the real FFmpeg and FFprobe executables",
]

[tool.ruff]
line-length = 100
target-version = "py311"
