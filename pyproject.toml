[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kyykka-editor"
version = "1.0.2"
description = "Desktop highlight editor for kyykka match videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7"]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "jburn" }]

[project.urls]
Homepage = "https://github.com/jburn/kyykka-editor"
Issues = "https://github.com/jburn/kyykka-editor/issues"

[project.optional-dependencies]
dev = ["pyinstaller>=6.10,<7", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.gui-scripts]
kyykka-editor = "kyykka_editor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kyykka_editor = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: exercises the real FFmpeg and FFprobe executables",
]

[tool.ruff]
line-length = 100
target-version = "py311"
